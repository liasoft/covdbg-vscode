name: Release VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate against package.json, e.g. v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Windows, so packaging can check each bundled covdbg's version and architecture before it ships.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        run: node ./scripts/verifyReleaseVersion.js "${{ steps.release_tag.outputs.value }}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The universal VSIX bundles the x64 covdbg, the win32-arm64 VSIX the ARM64 one.
      - name: Package VSIXs
        run: npm run package

      - name: Publish to VS Code Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not configured."
            echo "Create an Azure DevOps PAT with Marketplace (Manage) scope and add it as the VSCE_PAT GitHub Actions secret."
            exit 1
          fi

          mapfile -t VSIX_PATHS < <(find . -maxdepth 1 -type f -name '*.vsix' | sort)

          if [ "${#VSIX_PATHS[@]}" -ne 2 ]; then
            echo "Expected the universal and the win32-arm64 VSIX, found: ${VSIX_PATHS[*]:-none}"
            exit 1
          fi

          npx @vscode/vsce publish --packagePath "${VSIX_PATHS[@]}" -p "$VSCE_PAT"

      - name: Generate SHA256 checksum
        run: sha256sum *.vsix > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          generate_release_notes: true
          files: |
            *.vsix
            SHA256SUMS.txt
